name: campus-monitor

services:
  mysql:
    image: mysql:8.0
    container_name: campus_mysql
    environment:
      MYSQL_ROOT_PASSWORD: campus123
      MYSQL_DATABASE: campus_monitor
      MYSQL_USER: campus_user
      MYSQL_PASSWORD: campus123
    ports:
      - "8881:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campus-net

  redis:
    image: redis:7-alpine
    container_name: campus_redis
    ports:
      - "8880:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campus-net

  backend:
    build: ./backend
    container_name: campus_backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://campus_user:campus123@mysql:3306/campus_monitor
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-to-a-random-secret-in-production
      API_KEY: change-me-to-a-random-api-key-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    ports:
      - "8000:8000"
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions
    entrypoint: ["/bin/sh", "/app/docker-entrypoint.sh"]
    networks:
      - campus-net

  celery-worker:
    build: ./backend
    container_name: campus_celery_worker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://campus_user:campus123@mysql:3306/campus_monitor
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-to-a-random-secret-in-production
      API_KEY: change-me-to-a-random-api-key-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions
    command: celery -A app.tasks worker --loglevel=info
    networks:
      - campus-net

  celery-beat:
    build: ./backend
    container_name: campus_celery_beat
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://campus_user:campus123@mysql:3306/campus_monitor
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-to-a-random-secret-in-production
      API_KEY: change-me-to-a-random-api-key-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions
    command: celery -A app.tasks beat --loglevel=info
    networks:
      - campus-net

  frontend:
    build: ./frontend
    container_name: campus_frontend
    ports:
      - "8882:80"
    depends_on:
      - backend
    networks:
      - campus-net

volumes:
  mysql_data:
  redis_data:

networks:
  campus-net:
    driver: bridge
